version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahabat_app
    restart: unless-stopped
    volumes:
      - shared_public:/var/www/html/public_shared
    networks:
      - sahabat-network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: sahabat_web
    restart: unless-stopped
    ports:
      - "8209:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
      - shared_public:/var/www/html/public
    networks:
      - sahabat-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sahabat_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sahabat_sekolah}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-sahabat_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - sahabat-network
    # Port tidak diexpose ke host (internal only)
    # ports:
    #   - "3306:3306"

networks:
  sahabat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.169.91.0/24

volumes:
  dbdata:
  shared_public:
